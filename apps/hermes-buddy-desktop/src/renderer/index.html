<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Hermes Buddy</title><style>body{font:16px 'Segoe UI','Microsoft YaHei',sans-serif;background:#101827;color:#eef2ff;margin:0}.wrap{max-width:620px;margin:70px auto;padding:36px;background:#1e293b;border-radius:16px}h1{margin-top:0}p,label{color:#cbd5e1}input{box-sizing:border-box;width:100%;margin:6px 0 18px;padding:12px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:white}button{padding:12px 20px;border:0;border-radius:8px;background:#6366f1;color:white;font-weight:600;cursor:pointer}#status{min-height:24px;margin-top:18px;color:#93c5fd}.err{color:#fca5a5!important}</style></head><body><main class="wrap"><h1>Hermes Buddy</h1><p>连接你自己的 Hermes。密钥仅以 Windows 加密凭据形式保存在本机。</p><label>Windows Gateway 地址（246 默认使用 22124）<input id="url" placeholder="http://192.168.0.246:22124"></label><label>部署管理地址（默认同主机 :8700）<input id="managementUrl" placeholder="http://192.168.0.246:8700"></label><label>API Key<input id="key" type="password" autocomplete="off"></label><button id="connect">验证并配置 Buddy</button><div id="status"></div></main><script>const s=document.querySelector('#status');document.querySelector('#connect').onclick=async()=>{s.className='';s.textContent='正在验证 Gateway、创建会话并下发 Buddy 配置…';try{const result=await window.hermesBuddy.connect({baseUrl:url.value,managementUrl:managementUrl.value,apiKey:key.value});s.textContent=`配置完成。会话：${result.session.id||'已创建'}`;key.value=''}catch(e){s.className='err';s.textContent=e.message||String(e)}};window.hermesBuddy.connection().then(x=>{if(x.configured)s.textContent='此设备已配置过 Hermes；可重新连接以更新。'});</script></body></html>
