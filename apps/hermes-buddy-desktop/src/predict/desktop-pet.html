<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  /* 注意：不再使用 -webkit-app-region: drag —— 它会吞掉所有鼠标事件，
     导致点击菜单永远弹不出来。拖动改为 mousedown/mousemove 手动实现。 */

  /* pointer-events:none 让 canvas 永不拦截鼠标事件，
     所有交互由 window 级 capture 监听器处理。
     这是「无法点击/拖拽」的根因 -- PixiJS canvas 默认会吃掉事件。 */
  canvas { display: block; pointer-events: none; }

  /* ---- 回退模式：Live2D 加载失败时退回双帧 PNG ---- */
  #fallback {
    position: absolute;
    inset: 0;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  #fallback.on { display: flex; }
  #cat-idle, #cat-wave {
    position: absolute;
    bottom: 4px;
    width: 96%;
    object-fit: contain;
    object-position: center bottom;
    /* v4.5：去掉 drop-shadow 滤镜 —— 透明窗口上每帧全屏重算滤镜是卡顿主因 */
    transition: opacity 0.06s linear;
  }
  #cat-wave { opacity: 0; }
  #anim {
    position: absolute;
    inset: 0;
    transform-origin: 50% 92%;
  }
  #anim.breathe { animation: breathe 3.2s ease-in-out infinite; }
  #anim.hop { animation: hop 0.5s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.025, 0.975); }
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30% { transform: translateY(-6px) rotate(-2deg); }
    60% { transform: translateY(0) rotate(2deg); }
  }

  /* 气泡：主进程可发文本让猫「说话」 */
  #bubble {
    position: absolute;
    top: 0; left: 50%;
    transform: translate(-50%, 6px);
    max-width: 150px;
    background: #fff;
    color: #333;
    font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid #e0d5c8;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 2;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: '';
    position: absolute;
    bottom: -5px; left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #fff;
    border-bottom: 0;
  }

  /* v4.12.14：收音指示（热键触发麦克风时显示） */
  #listen {
    position: absolute;
    top: 0; left: 50%;
    transform: translate(-50%, -22px);
    display: none;
    align-items: center;
    gap: 4px;
    background: #e8443a;
    color: #fff;
    font: 11px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 3px 8px;
    border-radius: 10px;
    z-index: 3;
    pointer-events: none;
  }
  #listen.on { display: flex; animation: listenPulse 1s ease-in-out infinite; }
  @keyframes listenPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
</style>
</head>
<body>
  <div id="fallback">
    <div id="anim">
      <img id="cat-idle" src="./assets/pet-cat.png" draggable="false" alt="">
      <img id="cat-wave" src="./assets/pet-cat-wave.png" draggable="false" alt="">
    </div>
  </div>
  <div id="bubble"></div>
  <div id="listen">🎤 收听中…</div>
  <audio id="tts" style="display:none"></audio>
  <!-- v4.12.6：Live2D 脚本不再静态引入 —— 默认桌宠是这只 PNG 小猫（零 WebGL、不依赖模型，
       拖动最顺滑）。Live2D 仅在菜单里手动切换后，由 startLive2D() 动态加载。 -->
  <script>
    'use strict';
    const bubble = document.getElementById('bubble');
    const fallback = document.getElementById('fallback');
    const anim = document.getElementById('anim');
    const idle = document.getElementById('cat-idle');
    const waveImg = document.getElementById('cat-wave');

    // ---- 通用：气泡 / 点击-拖动判定（位移 < 5px 视为点击，左/右键都弹菜单）----
    function say(text) {
      bubble.textContent = text;
      bubble.classList.add('show');
      clearTimeout(bubble._t);
      bubble._t = setTimeout(() => bubble.classList.remove('show'), 4000);
    }

    let down = null;          // { x, y, t, btn, dragging, pid }
    const CLICK_SLOP = 5;
    let lastMenuAt = 0;       // 防止 click / mouseup / contextmenu 重复弹两次
    // v4.12.5 拖动节流：改用「时间节流」。
    // 之前用 rAF 节流，但高刷屏（120/144Hz）rAF 间隔只有 ~7ms，等于不节流 ——
    // 每秒上百次同步 setBounds（每次 ~1.2ms 阻塞主进程）是「按住移动卡顿」主因之一。
    // 这里硬限到 ~60fps，并在松手时补发最后一帧。
    const DRAG_MIN_INTERVAL = 16;
    let dragLastSentAt = 0;
    let dragPending = null;   // { dx, dy }
    let dragTimer = null;

    // v4.12.5b 拖动埋点：只在页面内累计（零额外 IPC），松手时一次性上报。
    let __trace = null;
    function traceReset() {
      __trace = { moves: 0, flushes: 0, firstAt: 0, lastAt: 0, maxGap: 0, lastMoveAt: 0, maxDx: 0, maxDy: 0, captureOk: false };
    }
    function traceMove(dx, dy, now) {
      if (!__trace) return;
      __trace.moves++;
      if (!__trace.firstAt) __trace.firstAt = now;
      if (__trace.lastMoveAt) { const gap = now - __trace.lastMoveAt; if (gap > __trace.maxGap) __trace.maxGap = gap; }
      __trace.lastMoveAt = now;
      __trace.lastAt = now;
      if (Math.abs(dx) > __trace.maxDx) __trace.maxDx = Math.abs(dx);
      if (Math.abs(dy) > __trace.maxDy) __trace.maxDy = Math.abs(dy);
    }
    function traceFlush() { if (__trace) __trace.flushes++; }

    function flushDrag(force) {
      if (!dragPending) return;
      const now = performance.now();
      const wait = DRAG_MIN_INTERVAL - (now - dragLastSentAt);
      if (!force && wait > 0) {
        if (!dragTimer) {
          dragTimer = setTimeout(() => { dragTimer = null; flushDrag(true); }, wait + 1);
        }
        return;
      }
      dragLastSentAt = now;
      const p = dragPending;
      dragPending = null;
      traceFlush();
      window.petApi?.dragMove?.(p.dx, p.dy);
    }

    function openMenu() {
      const now = Date.now();
      if (now - lastMenuAt < 400) return;
      lastMenuAt = now;
      tapMotion();
      window.petApi?.click();
    }

    /**
     * v4.12.5：改用 pointer 事件 + setPointerCapture。
     *
     * 之前用 mouse 事件且没有指针捕获：鼠标按住一旦移出这个 170x190 的小窗口，
     * 窗口就再也收不到 mousemove/mouseup —— 表现为「拖动顿住、拖不动」，
     * 且松手在窗口外时 down 永远清不掉，之后不按鼠标移动窗口也会跟着跑。
     * setPointerCapture 保证指针移出窗口后事件仍持续投递到本窗口。
     */
    function capturePointer(e) {
      const id = e.pointerId;
      const targets = [e.target, document.body, document.documentElement];
      for (const t of targets) {
        try { if (t && t.setPointerCapture) { t.setPointerCapture(id); return; } } catch (_) {}
      }
    }

    function onPointerDown(e) {
      if (e.button !== 0 && e.button !== 2) return;
      down = { x: e.screenX, y: e.screenY, t: Date.now(), btn: e.button, dragging: false, pid: e.pointerId };
      traceReset();
      try { capturePointer(e); } catch (_) {}
      if (__trace) __trace.captureOk = true;
      window.petApi?.dragStart?.();
    }

    function onPointerMove(e) {
      if (!down) return;
      const dx = e.screenX - down.x, dy = e.screenY - down.y;
      traceMove(dx, dy, performance.now());
      if (!down.dragging && Math.hypot(dx, dy) >= 3) {
        down.dragging = true;
        // 拖动中停掉 Live2D 渲染，把 GPU/主线程让给窗口移动
        setTickerPaused(true);
      }
      if (down.dragging) {
        dragPending = { dx, dy };
        flushDrag(false);
      }
    }

    function endDrag() {
      if (!down) return;
      down = null;
      if (dragTimer) { clearTimeout(dragTimer); dragTimer = null; }
      flushDrag(true);          // 补发最后一帧，避免松手瞬间位置回跳
      setTickerPaused(false);   // 恢复渲染
      // 一次性上报拖动埋点（额外仅 1 次 IPC）
      if (__trace) { window.petApi?.dragTrace?.(__trace); __trace = null; }
      window.petApi?.dragEnd?.();
    }

    function onPointerUp(e) {
      if (!down) return;
      const moved = Math.hypot(e.screenX - down.x, e.screenY - down.y);
      endDrag();
      if (moved < CLICK_SLOP) openMenu();
    }

    window.addEventListener('pointerdown', onPointerDown, true);
    window.addEventListener('pointermove', onPointerMove, true);
    window.addEventListener('pointerup', onPointerUp, true);
    // 指针被系统抢走（如切窗口）时结束拖动，否则窗口会黏着鼠标。
    // v4.12.5b：不再监听 window 的 blur —— 真实按住快速拖动透明置顶窗时焦点会短暂波动，
    // blur 会在拖动中途清掉 down，导致后续移动全部失效（"拖着拖着断/卡"）。
    // pointercancel 已足以覆盖真正的指针丢失。
    window.addEventListener('pointercancel', endDrag, true);
    window.addEventListener('contextmenu', (e) => { e.preventDefault(); openMenu(); });

    // ---- 主进程推送 ----
    window.petApi?.onSpeak?.(say);
    window.petApi?.onWave?.(() => tapMotion(2000));

    // ================= 语音（v4.12.14）=================
    const ttsAudio = document.getElementById('tts');
    const listenEl = document.getElementById('listen');
    let voiceMicId = '';
    let mediaRecorder = null;
    let recChunks = [];
    let recStream = null;

    window.petApi?.onVoiceConfig?.((cfg) => { if (cfg && cfg.micId != null) voiceMicId = cfg.micId; });

    async function playAudio({ path, speakerId } = {}) {
      if (!path) return;
      try {
        if (speakerId && ttsAudio.setSinkId) { try { await ttsAudio.setSinkId(speakerId); } catch (_) {} }
        ttsAudio.src = 'file://' + path;
        await ttsAudio.play();
      } catch (e) {
        window.petApi?.error?.('tts-play-failed: ' + (e && e.message ? e.message : e));
      }
    }
    window.petApi?.onSpeakAudio?.(playAudio);

    async function startCapture() {
      try {
        const constraints = voiceMicId
          ? { audio: { deviceId: { exact: voiceMicId } } }
          : { audio: true };
        recStream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (e) {
        window.petApi?.error?.('mic-denied: ' + (e && e.message ? e.message : e));
        return;
      }
      recChunks = [];
      try { mediaRecorder = new MediaRecorder(recStream); }
      catch (e) { window.petApi?.error?.('mediarecorder-unsupported: ' + (e && e.message ? e.message : e)); recStream.getTracks().forEach(t => t.stop()); return; }
      mediaRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) recChunks.push(ev.data); };
      mediaRecorder.onstop = async () => {
        listenEl.classList.remove('on');
        const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        recChunks = [];
        try {
          const buf = await blob.arrayBuffer();
          const bytes = new Uint8Array(buf);
          let bin = '';
          const step = 0x8000;
          for (let i = 0; i < bytes.length; i += step) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
          const b64 = btoa(bin);
          await window.petApi?.sendCapture(b64, blob.type);
        } catch (e) {
          window.petApi?.error?.('voice-capture-send-failed: ' + (e && e.message ? e.message : e));
        }
        if (recStream) { recStream.getTracks().forEach((t) => t.stop()); recStream = null; }
      };
      mediaRecorder.start();
      listenEl.classList.add('on');
    }

    function stopCapture() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    }

    window.petApi?.onListenCommand?.((on) => { if (on) startCapture(); else stopCapture(); });

    // ================= Live2D（v4.12.6 起默认关闭，按需动态加载）=================
    let model = null;
    let paused = false;
    let live2dLoading = false;

    function applyPause() {
      if (!window.__pixiApp) return;
      if (paused || document.hidden || dragActive()) window.__pixiApp.ticker.stop();
      else window.__pixiApp.ticker.start();
    }

    /**
     * v4.12.5：拖动中暂停 Live2D 渲染（on=true）/ 结束后恢复（on=false）。
     * 用户手动「暂停动画（省电）」时 paused=true，拖动结束也不得擅自恢复。
     */
    function dragActive() { return !!(down && down.dragging); }
    function setTickerPaused(on) {
      if (!window.__pixiApp) return;
      try {
        if (on || paused || document.hidden) window.__pixiApp.ticker.stop();
        else window.__pixiApp.ticker.start();
      } catch (_) {}
    }

    // 主进程菜单「暂停动画（省电）」/ 隐藏页面时停渲染，省 GPU/CPU
    window.petApi?.onPaused?.((v) => { paused = Boolean(v); applyPause(); });

    function tapMotion(ms) {
      if (model) {
        try { model.motion(Math.random() < 0.5 ? 'TapBody' : 'Idle'); } catch (_) {}
      } else {
        // 小猫模式：双帧挥手
        anim.classList.add('hop');
        let showWave = true;
        const flip = setInterval(() => {
          waveImg.style.opacity = showWave ? '1' : '0';
          idle.style.opacity = showWave ? '0' : '1';
          showWave = !showWave;
        }, 240);
        setTimeout(() => {
          clearInterval(flip);
          waveImg.style.opacity = '0';
          idle.style.opacity = '1';
          anim.classList.remove('hop');
        }, ms || 1800);
      }
    }

    document.addEventListener('visibilitychange', applyPause);

    // ---- 默认：显示小猫（开机即此状态，零 WebGL / 零模型依赖，拖动最顺滑）----
    function showCat() {
      fallback.classList.add('on');
      anim.classList.add('breathe');
    }
    showCat();

    // ---- 动态脚本加载器（仅切换到 Live2D 时才拉取，文件仍在本地）----
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.async = false;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('load fail: ' + src));
        document.head.appendChild(s);
      });
    }

    /**
     * 启动 Live2D（按需）。动态加载本地 pixi/core/pixi-live2d，创建 WebGL app，
     * 加载模型并隐藏小猫。失败自动退回小猫，不重复弹错误打扰。
     * @param {string} wanted 模型 URL（pet://...）
     */
    async function startLive2D(wanted) {
      if (model || live2dLoading || window.__pixiApp) return;
      live2dLoading = true;
      try {
        if (!window.PIXI) {
          await loadScript('./assets/live2d/pixi.min.js');
          await loadScript('./assets/live2d/live2dcubismcore.min.js');
          await loadScript('./assets/live2d/pixi-live2d-cubism4.min.js');
        }
        if (!window.PIXI || !window.PIXI.live2d || typeof Live2DCubismCore === 'undefined') {
          throw new Error('runtime missing');
        }
        const { Live2DModel } = window.PIXI.live2d;
        const app = new PIXI.Application({
          width: 170, height: 190,
          transparent: true,
          antialias: false,
          resolution: 1,
          autoStart: true,
        });
        window.__pixiApp = app;
        app.view.style.pointerEvents = 'none';
        document.body.appendChild(app.view);
        app.ticker.maxFPS = 20;

        const BUILTIN = 'pet://assets/live2d/hiyori/Hiyori.model3.json';
        const loadAt = async (url) => {
          const m = await Live2DModel.from(url, { autoInteract: false, motionPreload: 'IDLE' });
          const fit = Math.min(170 / m.width, 190 / m.height) * 1.12;
          m.scale.set(fit);
          m.x = 85 - m.width / 2;
          m.y = 190 - m.height - 2;
          app.stage.addChild(m);
          try { m.motion('Idle'); } catch (_) {}
          return m;
        };
        try { model = await loadAt(wanted || BUILTIN); }
        catch (e1) {
          if ((wanted || BUILTIN) === BUILTIN) throw e1;
          model = await loadAt(BUILTIN);
        }
        // 成功 → 隐藏小猫
        fallback.classList.remove('on');
        anim.classList.remove('breathe');
      } catch (e) {
        // 失败 → 确保退回小猫
        showCat();
        window.petApi?.error?.('live2d-fallback: ' + (e && e.message ? e.message : e));
      } finally {
        live2dLoading = false;
      }
    }

    // 仅当主进程经 query 指定 mode=live2d 时才自动启动（用户已手动切换并持久化）
    (() => {
      const q = new URLSearchParams(location.search);
      if (q.get('mode') === 'live2d') {
        startLive2D(q.get('model') || 'pet://assets/live2d/hiyori/Hiyori.model3.json');
      }
    })();
  </script>
</body>
</html>
