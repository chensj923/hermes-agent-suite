<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- v4.12.23：独立语音对话小窗 —— 聆听/识别/AI 回复都在这里滚动，不再打扰主窗口 -->
<title>语音对话</title>
<style>
  :root {
    --bg: #12141c; --surface: #1a1d28; --surface-2: #232735;
    --border: #2e3346; --text: #e8eaf2; --muted: #8b91a8; --accent: #7c8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  header {
    -webkit-app-region: drag;
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    border-radius: 10px 10px 0 0;
  }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
    transition: background .2s;
  }
  header .dot.listening { background: #ffb4a2; animation: blink 1s infinite; }
  header .dot.recognizing { background: #ffd479; animation: blink 1s infinite; }
  header .dot.thinking { background: #7fd1ff; animation: blink 1s infinite; }
  header .dot.speaking { background: #8be9a8; }
  header .title { font-size: 13px; font-weight: 600; }
  header .status {
    flex: 1; font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  header button {
    -webkit-app-region: no-drag;
    background: none; border: none; color: var(--muted);
    font-size: 15px; cursor: pointer; padding: 2px 6px; border-radius: 4px;
  }
  header button:hover { background: var(--surface-2); color: var(--text); }
  #log {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .msg {
    max-width: 86%; padding: 7px 11px;
    border-radius: 10px; font-size: 13px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent); color: #fff;
    border-bottom-right-radius: 3px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .msg.pending { opacity: .7; font-style: italic; }
  .msg.system {
    align-self: center;
    background: transparent; color: var(--muted);
    font-size: 11px; padding: 2px 6px;
  }
  .msg.error {
    align-self: flex-start;
    background: rgba(248,113,113,.12);
    border: 1px solid rgba(248,113,113,.5);
    color: #ffb4b4;
  }
  footer {
    flex-shrink: 0; padding: 6px 12px 9px;
    text-align: center; font-size: 11px; color: var(--muted);
    border-top: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <span class="title">语音对话</span>
    <span class="status" id="status">等待语音…</span>
    <button id="btn-close" title="关闭 (Esc)">✕</button>
  </header>
  <div id="log"></div>
  <footer>按快捷键说话 · 再按一次结束 · Esc 关闭</footer>
  <script>
    const log = document.getElementById('log');
    const dot = document.getElementById('dot');
    const status = document.getElementById('status');

    function addMsg(cls, text) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      log.appendChild(d);
      while (log.children.length > 80) log.removeChild(log.firstChild);
      log.scrollTop = log.scrollHeight;
      return d;
    }
    // pending 气泡引用：AI 回复拿到后原地替换
    let pendingAi = null;

    window.vc.onSession((evt) => {
      if (!evt || !evt.type) return;
      if (evt.type === 'open') {
        status.textContent = '聆听中…';
        dot.className = 'dot listening';
      } else if (evt.type === 'phase') {
        status.textContent = evt.text || '';
        dot.className = 'dot ' + (evt.phase || '');
        if (evt.phase === 'listening' && !log.children.length) addMsg('system', '🎙 正在聆听，说完再按一次快捷键');
      } else if (evt.type === 'user') {
        pendingAi = null;
        addMsg('user', evt.text || '');
      } else if (evt.type === 'ai') {
        if (evt.pending) {
          pendingAi = addMsg('ai pending', evt.text || '正在思考…');
        } else {
          if (pendingAi) { pendingAi.textContent = evt.text || ''; pendingAi.classList.remove('pending'); }
          else addMsg('ai', evt.text || '');
          pendingAi = null;
        }
      } else if (evt.type === 'error') {
        addMsg('error', evt.message || '出错了');
      }
    });

    document.getElementById('btn-close').addEventListener('click', () => window.vc.hide());
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.vc.hide(); });

    // 朗读：直接在小窗里播 data URL 音频（主窗口可以保持隐藏）
    let audioEl = null;
    window.vc.onPlay((payload) => {
      try {
        if (!audioEl) { audioEl = new Audio(); audioEl.autoplay = true; }
        audioEl.src = payload && payload.dataUrl ? payload.dataUrl : '';
        if (!audioEl.src) return;
        const p = audioEl.play();
        if (p && p.catch) p.catch(() => {});
      } catch (_) {}
    });
  </script>
</body>
</html>
